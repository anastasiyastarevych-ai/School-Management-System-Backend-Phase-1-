services:
  - type: web
    name: web-3
    runtime: python
    pythonVersion: 3.11
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py loaddata data.json
      python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11"
